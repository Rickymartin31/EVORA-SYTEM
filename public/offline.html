<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — EVORA</title>
    <style>
        :root { --bg: #f5f7fb; --card: #ffffff; --text: #1f2937; --muted: #5b6474; --border: #e6e8f0; --primary: #4f46e5; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --card: #171a23; --text: #e5e7eb; --muted: #9aa3b2; --border: #2a2f3c; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }
        .card { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; text-align: center; }
        .mark { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
                background: linear-gradient(135deg, #06b6d4, #22d3ee); color: #0e1547; font-weight: 800; font-size: 32px; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 12px; font-size: .95rem; }
        button { margin-top: 8px; border: 0; border-radius: 10px; padding: 10px 22px; background: var(--primary); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">E</div>
    <h1>You're offline</h1>
    <p>EVORA needs an internet connection to load this page. Check your Wi-Fi or mobile data and try again.</p>
    <p>Going to an event? Your QR e-ticket was also emailed to you as a PDF, so you can show it from your inbox.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
